<title>GJ 581g Sound Library</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a mixing-desk strip of sound rows; filters on top, each row = play key, waveform, name, moods, used-in, verdict switch */
:root{
  --bg:#F3F4EE; --panel:#FFFFFF; --ink:#13201A; --muted:#5D6B63; --line:#DCE1D8;
  --yellow:#FCCF3E; --green:#0B5E2A; --wave:#9AA79F; --wave-on:#0B5E2A;
  --keep:#1F8A4C; --big:#B57A00; --never:#C8281E; --chip:#EBEEE6;
  --display:"Space Grotesk",system-ui,sans-serif; --body:"Inter",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1512;--panel:#17201B;--ink:#E7EEE9;--muted:#93A39A;--line:#2A362F;--wave:#4C5C53;--wave-on:#FCCF3E;--keep:#4CC27F;--big:#F0B53A;--never:#FF6B5E;--chip:#212C26;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1512;--panel:#17201B;--ink:#E7EEE9;--muted:#93A39A;--line:#2A362F;--wave:#4C5C53;--wave-on:#FCCF3E;--keep:#4CC27F;--big:#F0B53A;--never:#FF6B5E;--chip:#212C26;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:1080px;margin:0 auto;padding-block:28px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:grid;gap:6px;margin-bottom:18px}
h1{font-family:var(--display);font-size:clamp(28px,5vw,40px);margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 span{background:var(--yellow);color:#13201A;padding:0 .2em;border-radius:4px}
.lede{color:var(--muted);max-width:66ch;margin:0}
.stats{display:flex;flex-wrap:wrap;gap:8px 18px;font-family:var(--mono);font-size:13px;color:var(--muted);margin-top:6px}
.stats b{color:var(--ink);font-weight:600}
.bar{display:grid;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.row1{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=search]{flex:1 1 220px;min-width:0;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:500 13px var(--body);padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--chip);color:var(--ink);cursor:pointer}
.chip[aria-pressed=true]{background:var(--green);border-color:var(--green);color:#fff}
.chip:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
.list{display:grid;gap:8px;margin-top:14px}
.s{display:grid;grid-template-columns:44px 132px minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.s.never{opacity:.55}
.play{width:44px;height:44px;border-radius:50%;border:0;background:var(--yellow);color:#13201A;cursor:pointer;display:grid;place-items:center}
.play svg{width:18px;height:18px}
.wave{display:flex;align-items:center;gap:1px;height:34px}
.wave i{flex:1;background:var(--wave);border-radius:1px;min-height:2px}
.s.on .wave i{background:var(--wave-on)}
.meta{min-width:0;display:grid;gap:3px}
.name{font-weight:600;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.name small{font:400 12px var(--mono);color:var(--muted)}
.desc{color:var(--muted);font-size:13px}
.tags{display:flex;gap:5px;flex-wrap:wrap;font-size:12px}
.tag{padding:1px 7px;border-radius:4px;background:var(--chip);color:var(--muted)}
.tag.u{background:transparent;border:1px solid var(--green);color:var(--ink)}
.tag.warn{border:1px solid var(--never);color:var(--never);background:transparent}
.lic{font-size:12px;color:var(--muted)}
.verdict{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.verdict button{font:500 12px var(--body);border:0;background:transparent;color:var(--muted);padding:7px 9px;cursor:pointer;white-space:nowrap}
.verdict button+button{border-left:1px solid var(--line)}
.verdict button[aria-pressed=true][data-v=keep]{background:var(--keep);color:#fff}
.verdict button[aria-pressed=true][data-v=big]{background:var(--big);color:#fff}
.verdict button[aria-pressed=true][data-v=never]{background:var(--never);color:#fff}
.verdict button:disabled{cursor:default}
.note{font-size:12px;color:var(--muted);margin-top:4px}
.empty{padding:30px;text-align:center;color:var(--muted)}
.status{font:12px var(--mono);color:var(--muted)}
@media (max-width:720px){.s{grid-template-columns:44px minmax(0,1fr)}.wave{grid-column:2;order:3}.verdict{grid-column:1/-1;justify-self:start;order:4}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<div class="wrap">
<header>
  <h1>Sound <span>Library</span></h1>
  <p class="lede">Every gag sound we can drop into a GJ 581g mix. Press play to hear it, filter by mood, and mark each one <b>Keep</b>, <b>Big moments only</b> or <b>Never</b>. Claude reads these marks before every mix. Gag sounds always sit in a gap between your words, never on one.</p>
  <div class="stats" id="stats"></div>
</header>
<div class="bar">
  <div class="row1">
    <input type="search" id="q" placeholder="Search sounds (trombone, bell, crowd…)" aria-label="Search sounds">
    <select id="src" aria-label="Source"><option value="">All sources</option><option>In-house</option><option>Mixkit</option></select>
    <select id="ver" aria-label="Your mark"><option value="">Any mark</option><option value="none">Not marked yet</option><option value="keep">Keep</option><option value="big">Big moments only</option><option value="never">Never</option></select>
    <select id="use" aria-label="Used in"><option value="">Used or unused</option><option value="used">Used in a chapter</option><option value="unused">Not used yet</option></select>
  </div>
  <div class="chips" id="moods" role="group" aria-label="Mood"></div>
  <div class="status" id="status">Loading your marks…</div>
</div>
<div class="list" id="list"></div>
</div>

const MOODS = {fail:'Fail', reveal:'Reveal', money:'Money', transition:'Transition', tech:'Tech & alerts', silence:'Silence & cold', cartoon:'Cartoon', crowd:'Crowd'};
let marks = {}, db = null, canWrite = false, mood = '', playing = null;
const $ = id => document.getElementById(id), au = $('au');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PLAY = '<svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z" fill="currentColor"/></svg>', STOP = '<svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" fill="currentColor"/></svg>';
$('moods').innerHTML = '<button class="chip" data-m="" aria-pressed="true">All moods</button>' + Object.entries(MOODS).map(([k, v]) => `<button class="chip" data-m="${k}" aria-pressed="false">${v}</button>`).join('');
$('moods').onclick = e => { const b = e.target.closest('.chip'); if (!b) return; mood = b.dataset.m; [...$('moods').children].forEach(c => c.setAttribute('aria-pressed', c === b)); draw(); };
['q', 'src', 'ver', 'use'].forEach(id => $(id).addEventListener('input', draw));
function stats() {
  const v = Object.values(marks).map(m => m.verdict), n = k => v.filter(x => x === k).length;
  $('stats').innerHTML = `<span><b>${SOUNDS.length}</b> sounds</span><span><b>${SOUNDS.filter(s => s.src === 'In-house').length}</b> in-house</span><span><b>${SOUNDS.filter(s => s.src === 'Mixkit').length}</b> Mixkit</span><span><b>${SOUNDS.filter(s => s.used.length).length}</b> used so far</span><span><b>${n('keep')}</b> keep · <b>${n('big')}</b> big moments · <b>${n('never')}</b> never</span>`;
}
function draw() {
  const q = $('q').value.trim().toLowerCase(), src = $('src').value, ver = $('ver').value, use = $('use').value;
  const rows = SOUNDS.filter(s => (!q || (s.name + ' ' + s.desc + ' ' + s.id + ' ' + s.tags.join(' ')).toLowerCase().includes(q)) && (!src || s.src === src) && (!mood || s.tags.includes(mood))
    && (!ver || (ver === 'none' ? !marks[s.id]?.verdict : marks[s.id]?.verdict === ver)) && (!use || (use === 'used') === (s.used.length > 0)));
  $('list').innerHTML = rows.length ? rows.map(s => { const v = marks[s.id]?.verdict || '';
    return `<div class="s${v === 'never' ? ' never' : ''}${playing === s.id ? ' on' : ''}" data-id="${s.id}">
      <button class="play" aria-label="Play ${esc(s.name)}">${playing === s.id ? STOP : PLAY}</button>
      <div class="wave" aria-hidden="true">${[...s.w].map(c => `<i style="height:${8 + (c.charCodeAt(0) - 48) * 10}%"></i>`).join('')}</div>
      <div class="meta"><div class="name">${esc(s.name)} <small>${s.dur.toFixed(1)} s · ${s.id}</small></div>
        ${s.desc ? `<div class="desc">${esc(s.desc)}</div>` : ''}
        <div class="tags">${s.tags.map(t => `<span class="tag">${MOODS[t]}</span>`).join('')}${s.used.map(u => `<span class="tag u">${esc(u)}</span>`).join('')}</div>
        <div class="lic">${s.src}: ${esc(s.lic)}${s.mkid ? ` · Mixkit #${s.mkid}` : ''}</div>
        ${marks[s.id]?.note ? `<div class="note">Note: ${esc(marks[s.id].note)}</div>` : ''}</div>
      <div class="verdict" role="group" aria-label="Your mark">${[['keep', 'Keep'], ['big', 'Big moments'], ['never', 'Never']].map(([k, l]) => `<button data-v="${k}" aria-pressed="${v === k}" ${canWrite ? '' : 'disabled'}>${l}</button>`).join('')}</div></div>`; }).join('')
    : '<div class="empty">No sound matches these filters.</div>';
  stats();
}
$('list').onclick = async e => {
  const row = e.target.closest('.s'); if (!row) return; const id = row.dataset.id;
  if (e.target.closest('.play')) { if (playing === id) { au.pause(); playing = null; } else { au.src = `s/${id}.mp3`; au.currentTime = 0; au.play().catch(() => {}); playing = id; } draw(); return; }
  const b = e.target.closest('.verdict button'); if (!b || !canWrite) return;
  const v = b.dataset.v, cur = marks[id]?.verdict, nv = cur === v ? null : v;
  const prev = marks[id]; marks[id] = {...(marks[id] || {}), verdict: nv}; draw();
  try { if (nv) await db.doc('verdicts/' + id).set({verdict: nv, note: prev?.note || '', updated: Date.now()}); else await db.doc('verdicts/' + id).delete(); $('status').textContent = 'Saved.'; }
  catch (err) { marks[id] = prev; draw(); $('status').textContent = 'Could not save that mark. Check your connection and try again.'; }
};
au.onended = () => { playing = null; draw(); };
draw();
(async () => {
  const t = setTimeout(() => { $('status').textContent = 'Your marks could not load, so the buttons are off. The sounds still play.'; }, 10000);
  try {
    db = await window.claude?.use?.('db'); const user = await window.claude?.use?.('user');
    if (!db) { clearTimeout(t); $('status').textContent = 'Marks are not available in this view. The sounds still play.'; return; }
    canWrite = user ? (user.can('data.write') !== false) : true;
    db.collection('verdicts').onSnapshot(snap => { clearTimeout(t); marks = {}; snap.docs.forEach(d => marks[d.id] = d.data()); $('status').textContent = canWrite ? 'Your marks save as you click.' : 'You can listen; only the owner can mark sounds.'; draw(); },
      () => { clearTimeout(t); $('status').textContent = 'Your marks could not load, so the buttons are off. The sounds still play.'; });
  } catch (e) { clearTimeout(t); $('status').textContent = 'Marks are not available in this view. The sounds still play.'; }
})();
