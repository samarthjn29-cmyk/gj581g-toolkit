// Dalton 1798 paper p. 28 (PD); Henry 1854 p. 25 (PD); UC Berkeley campus (CC BY 4.0). The gamut triangle is our drawing after Fong et al. Fig. 2 (illustration).
const LINES = [['So here’s the thing we all believe.', 1], ['That colour is out there, in the light, in the things we look at.', 2], ['Look at this yellow square for a moment.', 2],

  glow(160, 120, 700, R, a * 0.12); glow(1760, 980, 760, B, a * 0.16); glow(1760, 100, 560, GR, a * 0.1); }

  let i = -1; for (let j = 0; j < LT.length; j++) if (t >= LT[j][0] - 0.05 && t < (j + 1 < LT.length ? LT[j + 1][0] - 0.05 : END)) i = j; if (i < 0) return;
  post(() => { g.save(); g.font = `400 40px ${SERIF}`; const s = LT[i][2], w = g.measureText(s).width + 56; chip(960 - w / 2, 958, w, 66, 0.72); g.fillStyle = CREAM; g.textAlign = 'center'; g.fillText(s, 960, 1004); g.restore(); }); }

  g.restore(); }

const YEL = '#FFD60A';
function stripes(cx, cy, cw, chh, cols, rows, r, gr, b, a = 1) {   // a patch of screen: red, green and blue stripes per pixel (drawn, illustrative)
  g.save(); g.globalAlpha = a; const sw = cw / 3;
  for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) { const x = cx - cols * cw / 2 + i * cw, y = cy - rows * chh / 2 + j * chh;
    [[R, r], [GR, gr], [B, b]].forEach(([c, v], q) => { g.fillStyle = c; g.globalAlpha = a * (0.12 + 0.88 * v); g.fillRect(x + q * sw + 2, y + 3, sw - 4, chh - 6); }); }
  g.restore(); }
function wave(x0, x1, y, amp, lam0, lam1, a = 1, col = CREAM, w = 3, ph = 0) {   // a wave whose wavelength changes from lam0 to lam1 (pixels) along its length
  if (a <= 0) return; g.save(); g.globalAlpha = a; g.strokeStyle = col; g.lineWidth = w; g.beginPath(); let p = ph;
  for (let x = x0; x <= x1; x += 2) { const u = (x - x0) / (x1 - x0), lam = lerp(lam0, lam1, u); p += 2 * Math.PI * 2 / lam; const yy = y + amp * Math.sin(p); x === x0 ? g.moveTo(x, yy) : g.lineTo(x, yy); } g.stroke(); g.restore(); }
async function S1(t) {   // So here's the thing we all believe: the geranium from the end of chapter 1, its pink sitting beside it
  leaks(t, 0.5); const box = [180, 170, 900, 680], a = k(t, 0, 0.6);
  g.save(); g.globalAlpha = a; g.shadowColor = 'rgba(0,0,0,0.6)'; g.shadowBlur = 50; g.fillStyle = '#000'; g.fillRect(...box); g.restore(); cover(GER, lerp(1.0, 1.02, clamp(t / 4)), 0.33, 0.5, a, box);

async function S2(t) {   // That colour is out there, in the light, in the things we look at: three real things, each with its colour beside it, as if the colour were in them

    g.save(); g.globalAlpha = a; g.fillStyle = items[i][1]; g.beginPath(); g.arc(x, 820, 30, 0, 7); g.fill(); g.restore(); text(items[i][2], x, 890, 20, DIM, MONO, 'center', a); }
}
async function S3(t) {   // Look at this yellow square for a moment. Here's a question. Does your screen have a yellow light in it? A pure yellow square, held still
  leaks(t, 0.4); const a = k(t, L(2) - 0.1, 0.5);

}
async function S4(t) {   // Almost certainly not: inside the lens, a real close-up of a screen: red, green and blue dots, no yellow ones
  leaks(t, 0.4); g.fillStyle = YEL; g.fillRect(760, 300, 400, 400);

async function S5(t) {   // Your screen doesn't use a yellow light... It has red, green and blue lights, packed too tightly: the stripes, drawn large, all three lit
  leaks(t, 0.4); const a = L(6), z = ease((t - a) / (LE(7) - a));

async function S6(t) {   // Turn the red and green on together, and your brain reports yellow. Yellow, with no yellow light.

async function S9(t) {   // It comes in different wavelengths, the way sound comes in different pitches. Long waves, short waves, everything in between.

async function S10(t) {   // Somewhere between the light hitting your eye and you saying "yellow", a calculation happens. And it can be fooled.
  leaks(t, 0.5); const a = L(16), u = ease((t - a) / 1.5);

  const f = L(17), fa = k(t, f + 0.3, 0.6); if (fa > 0) { text('ONE YELLOW WAVELENGTH', 160, 400, 18, DIM, MONO, 'left', fa); text('OR RED + GREEN LIGHT MIXED', 160, 660, 18, DIM, MONO, 'left', fa);
    wave(120, 520, 630, 18, 120, 120, fa, R, 2, (t - f) * 3); wave(120, 520, 690, 18, 90, 90, fa, GR, 2, (t - f) * 3 + 1); text('SAME ANSWER', 1440, 610, 20, DIM, MONO, 'left', k(t, f + 1.2, 0.5)); }

async function S11(t) {   // To see how, we need to go back to a man who guessed how the eye might count: the cone lights count 1, 2, 3

  const e = clamp((t - (END - 1.0)) / 1.0); if (e > 0) { g.save(); g.globalAlpha = e; g.fillStyle = BG; g.fillRect(0, 0, 1920, 1080); g.restore(); }
}
const SHOTS = [[0, S1], [L(1) - 0.1, S2], [L(2) - 0.1, S3], [L(5) - 0.1, S4], [L(6) - 0.1, S5], [L(8) - 0.1, S6], [L(10) - 0.1, S7], [L(13) - 0.1, S8], [L(14) - 0.1, S9], [L(16) - 0.1, S10], [L(18) - 0.1, S11]];

const buf = document.createElement('canvas'); buf.width = 1920; buf.height = 1080; const bg = buf.getContext('2d');
window.render = async function (T) {
