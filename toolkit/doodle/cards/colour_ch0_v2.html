const SHOTS = [[0, A1], [3.6, A], [7.6, B1], [10.9, B2], [14.1, C2], [19.6, GAP], [37.0, E0], [38.9, E], [43.4, F1], [46.2, F2], [49.5, G], [55.6, H], [59.5, I], [61.4, J1], [66.38, J2], [69.6, Kk2], [78.3, L1], [83.3, L2], [89.5, M], [99.4, N]];
window.render = async function (T) {
  const t = T - P;

};
const grain = (() => { const c = document.createElement('canvas'); c.width = 1920 + 256; c.height = 1080 + 256; const x = c.getContext('2d'), im = x.createImageData(c.width, c.height);
