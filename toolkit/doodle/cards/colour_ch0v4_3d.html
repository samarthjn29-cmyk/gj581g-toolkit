<html><head><meta charset="utf-8">
<style>

<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>

<body><canvas id="c" width="1920" height="1080"></canvas>
<script type="module">
// Colour_v1 chapter 0 v4 "The eyes" (20 Nov 2026): the 3D shots of the new opening, in CLIP time on Sam's paced 00_opening (voice starts 0.6 s in).
//  ?shot=candle   0-17.9 s  "Manchester. July, 1844. A doctor named Joseph Ransome is standing over a body. ... He wanted his eyes opened."
//                 The eye alone on a dark table, lit by a flickering candle; three angles; the words beside it.
//  ?shot=through  17.9-26.6 s "So Ransome cuts a small hole in the back of one eye. He holds it up, and looks through it, at things that are red and green."
//                 The back of the eye opens (a clipping cap), three quick angles, then the view through the hole and the pupil at a red and a green object.
// Facts: Hektoen International and McGill OSS (claims C30-C31). Everything here is ILLUSTRATIVE and is tagged so.
import * as THREE from 'three';
import { makeStage, overlayKit, installRender, rimShell, glowSprite, ray, at, IN, OUT, SIG, SMOOTH, lerp, clamp, CREAM, DIM, HEX, EMIT, W, H } from '/cards/lab3d.js';

const q = new URLSearchParams(location.search), SHOT = q.get('shot') || 'candle', SUB = +(q.get('sub') || 8);
const out = document.getElementById('c'), g = out.getContext('2d');
const stage = makeStage({fog: 0.018, envIntensity: 0.18}), {scene, cam} = stage, ui = overlayKit(g, cam);

// ---------- lights ----------
scene.add(new THREE.HemisphereLight('#90A4D0', '#1A0A08', 0.45));
const key = new THREE.DirectionalLight('#FFF1E0', 2.4); key.position.set(-4, 6, 8); key.castShadow = true; key.shadow.mapSize.set(2048, 2048); scene.add(key);
const rim = new THREE.DirectionalLight('#8FB4FF', 1.6); rim.position.set(6, -2, -6); scene.add(rim);

// ---------- the eye (pupil facing +x), built so it can be cut open two ways ----------
const R = 1.2;
const sagittal = new THREE.Plane(new THREE.Vector3(0, 0, -1), 0);            // keep z <= 0: the cut-away view (filter shot)
const XC = 0.05, backHalf = new THREE.Plane(new THREE.Vector3(-1, 0, 0), XC), frontHalf = new THREE.Plane(new THREE.Vector3(1, 0, 0), -XC);   // the opened view
function irisTexture() { const c = document.createElement('canvas'); c.width = c.height = 512; const x = c.getContext('2d'); const cx = 256;
  const gr = x.createRadialGradient(cx, cx, 60, cx, cx, 256); gr.addColorStop(0, '#2A1A0E'); gr.addColorStop(0.3, '#6B4A2A'); gr.addColorStop(0.75, '#3E6B8C'); gr.addColorStop(1, '#1E2E40'); x.fillStyle = gr; x.fillRect(0, 0, 512, 512);
  let s = 11; const r = () => (s = (s * 16807) % 2147483647) / 2147483647; x.globalAlpha = 0.35;
  for (let i = 0; i < 520; i++) { const a = r() * 6.283, r0 = 70 + r() * 30, r1 = 190 + r() * 60; x.strokeStyle = r() > 0.5 ? '#C9A070' : '#1C2C3C'; x.lineWidth = 1 + r() * 1.5; x.beginPath(); x.moveTo(cx + Math.cos(a) * r0, cx + Math.sin(a) * r0); x.lineTo(cx + Math.cos(a + (r() - 0.5) * 0.2) * r1, cx + Math.sin(a + (r() - 0.5) * 0.2) * r1); x.stroke(); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; }
function buildEye(clips) {
  const eye = new THREE.Group();
  const cp = extra => [...clips, ...(extra || [])];
  const sclera = new THREE.Mesh(new THREE.SphereGeometry(R, 128, 96), new THREE.MeshPhysicalMaterial({color: '#E2DED8', roughness: 0.42, clearcoat: 0.5, clearcoatRoughness: 0.35, sheen: 0.6, sheenColor: new THREE.Color('#FFD8D0'), side: THREE.DoubleSide, clippingPlanes: cp()}));
  sclera.castShadow = true; eye.add(sclera);
  const choroid = new THREE.Mesh(new THREE.SphereGeometry(R * 0.972, 128, 96), new THREE.MeshStandardMaterial({color: '#2A0C0C', roughness: 0.9, side: THREE.BackSide, clippingPlanes: cp()})); eye.add(choroid);
  const retina = new THREE.Mesh(new THREE.SphereGeometry(R * 0.962, 128, 96), new THREE.MeshStandardMaterial({color: '#B4473A', emissive: '#521610', emissiveIntensity: 0.8, roughness: 0.7, side: THREE.BackSide, clippingPlanes: cp([new THREE.Plane(new THREE.Vector3(-1, 0, 0), 0.5)])})); eye.add(retina);
  const fovea = new THREE.Mesh(new THREE.CircleGeometry(0.08, 32), new THREE.MeshStandardMaterial({color: '#7A2A20', emissive: '#7A2A20', emissiveIntensity: 0.6, clippingPlanes: cp()})); fovea.position.set(-R * 0.955, 0, 0); fovea.rotation.y = Math.PI / 2; eye.add(fovea);
  // vitreous: a clear gel; its tint is Beer-Lambert absorption over the path (attenuationColor / attenuationDistance)
  const vit = new THREE.MeshPhysicalMaterial({color: '#FFFFFF', roughness: 0.04, transmission: 1.0, thickness: 2.2, ior: 1.336, attenuationColor: new THREE.Color('#2F6BFF'), attenuationDistance: 1e6, transparent: true, side: THREE.FrontSide, clippingPlanes: cp()});
  const vitreous = new THREE.Mesh(new THREE.SphereGeometry(R * 0.9, 96, 64), vit); eye.add(vitreous);
  const tintGlow = new THREE.Mesh(new THREE.SphereGeometry(R * 0.93, 64, 48), new THREE.MeshBasicMaterial({color: '#3A6CFF', transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.BackSide, clippingPlanes: cp()})); eye.add(tintGlow);
  // front: iris, lens, cornea
  const iris = new THREE.Mesh(new THREE.RingGeometry(0.17, 0.5, 96), new THREE.MeshStandardMaterial({map: irisTexture(), roughness: 0.55, side: THREE.DoubleSide, clippingPlanes: cp()})); iris.rotation.y = Math.PI / 2; iris.position.x = R * 0.9; eye.add(iris);
  const lens = new THREE.Mesh(new THREE.SphereGeometry(0.38, 64, 48), new THREE.MeshPhysicalMaterial({color: '#F4F8FF', roughness: 0.03, transmission: 1.0, thickness: 0.5, ior: 1.42, transparent: true, clippingPlanes: cp()})); lens.scale.set(0.42, 1, 1); lens.position.x = R * 0.78; eye.add(lens);
  const cornea = new THREE.Mesh(new THREE.SphereGeometry(0.58, 96, 48, 0, Math.PI * 2, 0, Math.PI * 0.33), new THREE.MeshPhysicalMaterial({color: '#FFFFFF', roughness: 0.0, transmission: 1.0, thickness: 0.08, ior: 1.376, clearcoat: 1, transparent: true, side: THREE.DoubleSide, clippingPlanes: cp()}));
  cornea.rotation.z = -Math.PI / 2; cornea.position.x = R * 0.6; eye.add(cornea);
  // optic nerve at the back
  const nerve = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.22, 1.4, 48, 1, true), new THREE.MeshStandardMaterial({color: '#E9D2C4', roughness: 0.6, clippingPlanes: cp()})); nerve.rotation.z = Math.PI / 2; nerve.position.set(-R - 0.55, -0.05, 0); eye.add(nerve);
  const rimS = rimShell(new THREE.SphereGeometry(R * 1.004, 96, 64), '#A9C8FF', 3.2, 0.5); rimS.material.clippingPlanes = cp(); eye.add(rimS);
  return {eye, vit, tintGlow, sclera, retina, nerve};
}
const C = new THREE.Color();
function setTint(e, u) { e.vit.attenuationDistance = lerp(1e6, 0.42, clamp(u) ** 0.35); e.tintGlow.material.opacity = 0.34 * clamp(u); e.retina.material.emissiveIntensity = lerp(0.8, 0.25, clamp(u)); e.retina.material.color.set('#B4473A').lerp(new THREE.Color('#2A2F55'), 0.7 * clamp(u)); }


let update = () => {}, overlay = () => {};
const SERIF = 'Fraunces, Georgia, serif';
function words(items, t, x = 1180, y = 420, maxw = 640) {   // the words beside the picture: [t0, text, colour, size, t1?]
  let yy = y; for (const [t0, s, col, size, t1] of items) { const a = at(t, t0, 0.35, IN) * (t1 ? 1 - at(t, t1, 0.3, OUT) : 1); if (a <= 0.001) continue; const sz = size || 52;
    g.save(); g.globalAlpha = a; g.font = `400 ${sz}px ${SERIF}`; g.fillStyle = col || CREAM; const ws = s.split(' '); let line = '', lines = [];
    for (const w of ws) { const tl = line ? line + ' ' + w : w; if (g.measureText(tl).width > maxw && line) { lines.push(line); line = w; } else line = tl; } lines.push(line);
    lines.forEach((l, i) => g.fillText(l, x, yy + (1 - a) * 12 + i * sz * 1.2)); g.restore(); yy += lines.length * sz * 1.2 + 24; } }
function shade(a = 1) { const gr = g.createLinearGradient(1020, 0, 1460, 0); gr.addColorStop(0, 'rgba(5,7,15,0)'); gr.addColorStop(1, `rgba(5,7,15,${0.8 * a})`); g.fillStyle = gr; g.fillRect(1020, 0, 900, 1080); }
const flick = t => 1 + 0.10 * Math.sin(t * 11.3) + 0.06 * Math.sin(t * 23.9 + 1.3) + 0.04 * Math.sin(t * 41.7);

if (SHOT === 'candle') {
  const e = buildEye([]); scene.add(e.eye); e.eye.position.set(0, 0, 0);
  key.intensity = 0.35; rim.intensity = 0.5; rim.color.set('#6F86C8');
  const candle = new THREE.PointLight('#FFAE5A', 7, 14, 1.6); candle.position.set(-3.4, 0.9, 3.4); candle.castShadow = true; scene.add(candle);
  const flame = glowSprite('#FFB25C'); flame.position.set(-3.2, 0.3, -2.5); flame.scale.setScalar(1.2); flame.material.opacity = 0.85; scene.add(flame);
  const table = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.MeshStandardMaterial({color: '#2A1A10', roughness: 0.85})); table.rotation.x = -Math.PI / 2; table.position.y = -R - 0.02; table.receiveShadow = true; scene.add(table);
  update = t => {
    const f = flick(t); candle.intensity = 7 * f; cam.setViewOffset(W, H, W * 0.17, 0, W, H); flame.material.opacity = 0.75 * f; flame.scale.setScalar(1.1 + 0.08 * Math.sin(t * 9));
    let p, l;   // three angles: wide (0-5.8), low close (5.8-14.7), front close (14.7-)
    if (t < 5.8) { const u = at(t, 0, 5.8, SMOOTH); p = [lerp(5.8, 4.6, u), lerp(2.2, 1.6, u), lerp(5.0, 4.2, u)]; l = [0, -0.1, 0]; }
    else if (t < 14.7) { const u = at(t, 5.8, 8.9, SMOOTH); p = [lerp(-3.6, -2.6, u), lerp(0.1, 0.5, u), lerp(3.4, 3.8, u)]; l = [0.2, 0, 0]; }
    else { const u = at(t, 14.7, 3.2, SMOOTH); p = [lerp(5.4, 4.6, u), lerp(0.7, 0.5, u), lerp(1.2, 0.8, u)]; l = [0, 0, 0]; }
    cam.position.set(...p); cam.lookAt(...l);
    stage.bokeh.uniforms.focus.value = cam.position.length(); stage.bokeh.uniforms.aperture.value = 0.0012;
    e.eye.rotation.y = 0.25 * Math.sin(t * 0.21) + (t > 14.7 ? 0 : 0.6);
  };
  overlay = t => {
    ui.tag([['MANCHESTER · JULY 1844', CREAM], ['ILLUSTRATIVE', DIM]], at(t, 0.5, 0.4, IN));
    shade(at(t, 2.2, 0.5, IN));
    words([[2.4, 'July, 1844.', CREAM, 64, 5.7], [5.9, 'Joseph Ransome,', CREAM, 58, 14.6], [6.9, 'a doctor', '#C9BFAE', 40, 14.6], [10.4, 'The man died yesterday.', CREAM, 48, 14.6], [12.3, 'He asked for this.', '#FFC98A', 48, 14.6]], t, 1180, 400);
    words([[14.76, 'He wanted his eyes opened.', CREAM, 76]], t, 1160, 470, 680);
  };
}

if (SHOT === 'through') {
  const cap = new THREE.Plane(new THREE.Vector3(1, 0, 0), R * 1.2);   // keeps x >= -const: moved in to open the back of the eye
  const e = buildEye([cap]); scene.add(e.eye);
  key.intensity = 0.6; rim.intensity = 0.8;
  const candle = new THREE.PointLight('#FFAE5A', 7, 14, 1.6); candle.position.set(-3.6, 1.4, 3.6); scene.add(candle);
  const keepThrough = new Set(); e.eye.traverse(o => { const r = o.geometry?.parameters?.radius; if (o.isMesh && (r === 0.38 || r === 0.58)) keepThrough.add(o); });
  const red = new THREE.Mesh(new THREE.SphereGeometry(0.55, 48, 32), new THREE.MeshStandardMaterial({color: '#D8261B', roughness: 0.4})); red.position.set(5.5, 0.5, -0.45); scene.add(red);
  const green = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.9, 0.9), new THREE.MeshStandardMaterial({color: '#2E9B38', roughness: 0.5})); green.position.set(5.5, -0.5, 0.55); green.rotation.set(0.4, 0.6, 0.2); scene.add(green);
  const fill = new THREE.PointLight('#FFF1E0', 18, 10, 1.4); fill.position.set(4.2, 1.5, 1.5); scene.add(fill);
  update = t => {
    const f = flick(t); candle.intensity = 7 * f; cam.setViewOffset(W, H, t >= 21.6 && t < 23.1 ? 0 : W * 0.17, 0, W, H);
    const open = at(t, 19.2, 1.0, SIG); cap.constant = lerp(R * 1.2, R * 0.74, open);
    red.visible = green.visible = t >= 23.1;
    const inside = t >= 23.1; e.eye.traverse(o => { if (o.isMesh && o !== e.eye) o.visible = inside ? keepThrough.has(o) : (o === e.nerve ? open < 0.05 : true); });
    let p, l;
    if (t < 21.6) { const u = at(t, 17.9, 3.7, SMOOTH); p = [lerp(-4.2, -3.4, u), lerp(1.6, 1.0, u), lerp(3.6, 2.6, u)]; l = [-0.6, 0, 0]; }   // the back of the eye, the hole opening
    else if (t < 22.1) { p = [-2.4, 0.3, 0.6]; l = [-0.9, 0, 0]; }                    // burst 1: into the hole
    else if (t < 22.6) { p = [-2.1, 1.5, 1.9]; l = [-0.9, 0, 0]; }                    // burst 2: the opened back, from behind and above
    else if (t < 23.1) { p = [-0.7, 0.25, 3.6]; l = [0, 0, 0]; }                      // burst 3: side on, the hole's edge against the dark
    else { const u = at(t, 23.1, 3.5, SMOOTH); p = [lerp(-0.2, 0.3, u), 0.02, 0.0]; l = [6, 0, 0]; }   // looking through it: the camera inside the opened eye, out through lens and cornea
    cam.position.set(...p); cam.lookAt(...l);
    stage.bokeh.uniforms.focus.value = t >= 23.1 ? 6.5 : cam.position.distanceTo(new THREE.Vector3(-0.9, 0, 0)); stage.bokeh.uniforms.aperture.value = t >= 23.1 ? 0.0004 : 0.001;
    e.eye.rotation.set(0, 0, 0);
  };
  overlay = t => {
    ui.tag([['RANSOME\'S TEST · 1844', CREAM], ['ILLUSTRATIVE', DIM]], at(t, 18.0, 0.4, IN));
    if (t < 21.6) { shade(1); words([[18.4, 'A small hole', CREAM, 64], [19.6, 'in the back of one eye.', CREAM, 48]], t, 1180, 420); }
    if (t >= 23.1) { const m = g.createRadialGradient(780, 540, 250, 780, 540, 520); m.addColorStop(0, 'rgba(20,4,4,0)'); m.addColorStop(0.75, 'rgba(60,10,8,0.85)'); m.addColorStop(1, 'rgba(8,2,2,1)'); g.fillStyle = m; g.fillRect(0, 0, 1920, 1080);   // the rim of the hole
      shade(at(t, 23.2, 0.4, IN)); words([[23.3, 'He looks through it,', CREAM, 52], [24.4, 'at red', '#FF6A55', 58], [24.8, 'and green.', '#5BE08A', 58]], t, 1180, 420); }
  };
}

installRender({stage, g, update, overlay, P: 0, SUB});
await Promise.all([document.fonts.load('500 20px "JetBrains Mono"'), document.fonts.load('400 40px Fraunces')]); window.ready = true;
</script></body></html>
