<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Hand;src:url(/node_modules/@fontsource/patrick-hand/files/patrick-hand-latin-400-normal.woff2)}
html,body{margin:0;background:#fbf8f1}
canvas{display:block}
</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script type="module">
import rough from '/node_modules/roughjs/bundled/rough.esm.js';
const cv = document.getElementById('c'), g = cv.getContext('2d'), rc = rough.canvas(cv);
const Q = new URLSearchParams(location.search);
const INK = Q.get('ink') || '#1d1b19', RED = Q.get('accent') || '#d23a2a', GOLD = Q.get('gold') || '#e0a526', GREY = Q.get('grey') || '#9a958c', PAPER = Q.get('paper') || '#fbf8f1';
const COLS = 40, ROWS = 10, CELL = 34, GAP = 6, X0 = 160, Y0 = 290;
// deterministic states (illustration only): 1 = watching gods, 0 = none, 2 = nobody knows
let s = 7; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
const cells = [];
for (let c = 0; c < COLS; c++) for (let r = 0; r < ROWS; r++) {
  const u = rnd(); cells.push({c, r, st: u < 0.22 ? 1 : u < 0.42 ? 0 : 2, d: rnd(), seed: 1 + Math.floor(rnd() * 9999)});
}
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => { x = clamp(x); return x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2; };
const back = x => { x = clamp(x); const c1 = 1.7, c3 = c1 + 1; return 1 + c3*Math.pow(x-1,3) + c1*Math.pow(x-1,2); };
function text(t, x, y, size, color, k = 1, align = 'center', rot = 0) {
  if (k <= 0) return; g.save(); g.font = `${size}px Hand`; g.fillStyle = color; g.textAlign = align; g.textBaseline = 'middle';
  g.translate(x, y); g.rotate(rot); const w = g.measureText(t).width; const left = align === 'center' ? -w/2 : align === 'right' ? -w : 0;
  g.beginPath(); g.rect(left - 10, -size, (w + 20) * clamp(k), size * 2); g.clip(); g.fillText(t, 0, 0); g.restore();
}
function render(t) {
  const boil = Math.floor(t * 6) % 3;            // gentle line boil, 6 times a second
  g.fillStyle = PAPER; g.fillRect(0, 0, 1920, 1080);
  // scene label (top centre), like the doodle explainers
  text('400 past societies', 960, 150, 78, INK, ease((t - 0.1) / 0.9));
  text('a big database of history', 960, 215, 40, GREY, ease((t - 0.9) / 0.7));
  // grid
  const flipStart = 7.6, flipEnd = 11.2;
  let flipped = 0;
  for (const e of cells) {
    const x = X0 + e.c * (CELL + GAP), y = Y0 + e.r * (CELL + GAP);
    const appear = back((t - 0.6 - e.c * 0.055 - e.r * 0.01) / 0.35);
    if (appear <= 0) continue;
    const fillK = clamp((t - 3.0 - e.c * 0.025) / 0.4);
    const flipT = flipStart + e.d * (flipEnd - flipStart - 0.4);
    const isFlipped = e.st === 2 && t > flipT; if (isFlipped) flipped++;
    const sc = appear * (isFlipped ? 1 + 0.25 * Math.max(0, 1 - (t - flipT) / 0.25) : 1);
    const pulse = e.st === 2 && t > 5 && t < flipT ? 1 + 0.06 * Math.sin((t - 5) * 7 + e.d * 6) : 1;
    const w = CELL * sc * pulse, cx = x + CELL/2, cy = y + CELL/2;
    const o = {seed: e.seed + boil, roughness: 1.3, stroke: INK, strokeWidth: 1.6};
    if (fillK > 0 && e.st === 1) Object.assign(o, {fill: GOLD, fillStyle: 'solid'});
    if (fillK > 0 && e.st === 0) Object.assign(o, {fill: GREY, fillStyle: 'hachure', hachureGap: 5, fillWeight: 1.2});
    g.globalAlpha = fillK > 0 || e.st === 2 ? 1 : 1;
    rc.rectangle(cx - w/2, cy - w/2, w, w, o);
    if (e.st === 2 && fillK > 0 && !isFlipped) text('?', cx, cy + 2, 30 * sc, INK, 1);
    if (isFlipped) { const k = clamp((t - flipT) / 0.18); const o2 = {seed: e.seed + boil, stroke: RED, strokeWidth: 3, roughness: 1.2};
      rc.line(cx - w*.35, cy - w*.35, cx - w*.35 + w*.7*k, cy - w*.35 + w*.7*k, o2);
      if (k >= 1) rc.line(cx + w*.35, cy - w*.35, cx + w*.35 - w*.7*clamp((t - flipT - .18)/.18), cy - w*.35 + w*.7*clamp((t - flipT - .18)/.18), o2); }
  }
  // legend
  const lk = ease((t - 3.6) / 0.6), ly = 780;
  if (lk > 0) { g.globalAlpha = lk;
    rc.rectangle(330, ly - 20, 40, 40, {seed: 11 + boil, fill: GOLD, fillStyle: 'solid', stroke: INK}); text('watching gods', 390, ly, 44, INK, 1, 'left');
    rc.rectangle(780, ly - 20, 40, 40, {seed: 12 + boil, fill: GREY, fillStyle: 'hachure', hachureGap: 5, stroke: INK}); text('no watching gods', 840, ly, 44, INK, 1, 'left');
    rc.rectangle(1270, ly - 20, 40, 40, {seed: 13 + boil, stroke: INK}); text('?', 1290, ly + 2, 34, INK); text('nobody knows', 1330, ly, 44, INK, 1, 'left');
    g.globalAlpha = 1; }
  // beat captions
  text('the records just aren\'t there', 960, 890, 56, INK, ease((t - 5.0) / 0.8) * (1 - ease((t - 7.3) / 0.3)));
  if (t > 7.6) { const k = ease((t - 7.6) / 0.6) * (1 - ease((t - 12.4) / 0.3));
    text('but the study counted every "?" as "no"', 960, 890, 56, RED, k); }
  if (t > 12.6) {
    // stamp
    const k = back((t - 12.6) / 0.45), sc = 1.6 - 0.6 * k; g.save(); g.translate(960, 510); g.rotate(-0.06); g.scale(sc, sc); g.globalAlpha = clamp(k);
    g.fillStyle = PAPER; g.globalAlpha = clamp(k) * 0.92; g.fillRect(-470, -95, 940, 190);
    rc.rectangle(-470, -95, 940, 190, {seed: 31 + boil, stroke: RED, strokeWidth: 6, roughness: 1.6});
    g.restore(); text('"we don\'t know" is not "no"', 960, 505, 92, RED, clamp(k * 1.5), 'center', -0.06);
    g.globalAlpha = 1;
  }
  text('illustration, not the real counts', 1840, 1040, 30, GREY, ease((t - 3.6) / 0.6), 'right');
}
window.render = render;
document.fonts.load('40px Hand').then(() => { window.ready = true; render(0); });
</script></body></html>
