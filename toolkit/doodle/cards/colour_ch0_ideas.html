// ---------------- Idea 1: the round window (0-6.9) ----------------

// ---------------- Idea 3: his own words, and a hole in the page (17.9-26.6) ----------------
// p202 image px (2288 x 4010). Lines: 'In the other eye, the posterior part being removed by' y~2392; 'a vertical section in a plane...' y~2480;
// 'able to see objects as through a lens' y~2648 x 380-1445; 'omit to place scarlet and green together' y~2902 x 380-1405.
const HOLE = [1180, 2740];   // the hole, in page px
async function W3(t) {
  g.fillStyle = '#120D08'; g.fillRect(0, 0, 1920, 1080);

  g.save(); g.filter = 'blur(14px) brightness(0.3) sepia(0.7)'; cover(I.R_henry1854_p25, 1.6 + 0.04 * (t - 17.9), 0.5, 0.3 + 0.03 * (t - 17.9), 1); g.restore();

  const cutA = k(t, 19.5, 0.5);
  if (cutA > 0) { g.save(); g.beginPath(); g.arc(hx, hy, holeR, 0, 7); g.clip();
    const R = Math.max(holeR, 10); cover(await seek(V.apples, 0.5 + (t - 19.5) * 0.6), 1.1 - 0.05 * dive, 0.5, 0.5, 1, [hx - R * 1.1, hy - R * 1.1, R * 2.2, R * 2.2]);
    g.fillStyle = `rgba(0,0,0,${0.85 * (1 - cutA) + 0.25 * (1 - dive)})`; g.fillRect(hx - R, hy - R, R * 2, R * 2); g.restore(); }

  const u1 = clamp((t - 18.44) / 0.9); hl(830, 2350, 2200, 2430, clamp(u1 * 2)); hl(380, 2440, 1135, 2518, clamp(u1 * 2 - 1));
